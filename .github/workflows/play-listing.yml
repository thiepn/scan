name: Google Play Listing Validation

on:
  pull_request:
    paths:
      - 'play/**'
      - 'scripts/validate-play-listing.py'
      - '.github/workflows/play-listing.yml'
  push:
    branches: [main]
    paths:
      - 'play/**'
      - 'scripts/validate-play-listing.py'
      - '.github/workflows/play-listing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Google Play listing package
        run: python3 scripts/validate-play-listing.py

      - name: Validate PowerShell release tooling syntax
        shell: pwsh
        run: |
          $files = @(
            'scripts/bootstrap-production-signing.ps1',
            'scripts/check-play-readiness.ps1',
            'scripts/finalize-v1-release.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file: $($_.Message)" }
              exit 1
            }
            Write-Host "$file syntax OK"
          }
