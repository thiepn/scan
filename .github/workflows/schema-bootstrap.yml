name: Freeze Room Schema

on:
  push:
    branches:
      - phase20-v1-production-certification

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install generated v22 schema
        run: |
          mkdir -p app/schemas
          unzip -oq .phase20-room-schema.zip -d app/schemas
          rm .phase20-room-schema.zip
          rm .github/workflows/schema-bootstrap.yml

      - name: Commit schema snapshot and remove bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/schemas .phase20-room-schema.zip .github/workflows/schema-bootstrap.yml
          git diff --cached --exit-code && exit 0
          git commit -m "Freeze Room v22 schema"
          git push origin HEAD:${GITHUB_REF_NAME}
