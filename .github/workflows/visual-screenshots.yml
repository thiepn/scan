name: Capture v1 Screenshots

on:
  push:
    branches:
      - visual-capture-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scan-v1-visual-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-13
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Capture representative app surfaces
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.thiepn.scan.VisualScreenshotInstrumentedTest --stacktrace && mkdir -p visual-screenshots && adb pull /sdcard/scan-v1-screenshots/. visual-screenshots/

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-v1-visual-screenshots
          if-no-files-found: error
          retention-days: 7
          path: visual-screenshots/
