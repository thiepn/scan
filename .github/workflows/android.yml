name: Android CI

on:
  push:
    branches: [main, v2/development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Validate release PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            "scripts/bootstrap-production-signing.ps1",
            "scripts/check-play-readiness.ps1",
            "scripts/collect-device-evidence.ps1",
            "scripts/run-v1-device-qa.ps1",
            "scripts/verify-v1-evidence.ps1",
            "scripts/test-v1-evidence-verifier.ps1",
            "scripts/finalize-v1-release.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - name: Run release integrity self-tests
        run: |
          bash -n scripts/promote-v1-accepted-artifact.sh
          bash -n scripts/test-promote-v1-accepted-artifact.sh
          bash -n scripts/verify-release-publication.sh
          bash -n scripts/test-verify-release-publication.sh
          bash -n scripts/wait-v1-release-immutable.sh
          bash -n scripts/resolve-v1-release-state.sh
          bash -n scripts/test-v1-release-recovery.sh

          bash scripts/test-promote-v1-accepted-artifact.sh
          bash scripts/test-verify-release-publication.sh
          bash scripts/test-v1-release-recovery.sh

      - name: Build and test
        run: gradle :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --stacktrace
