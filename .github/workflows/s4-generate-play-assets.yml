name: S4 Generate Google Play assets

on:
  push:
    branches: [s4-google-play-presence]
    paths:
      - '.github/workflows/s4-generate-play-assets.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout S4 branch
        uses: actions/checkout@v5
        with:
          ref: s4-google-play-presence
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Import authentic phone screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p play/store-assets/phone
          for file in 01-library 02-scan-modes 03-sort-filter 04-automation-center 05-document-view 06-export-pdf; do
            curl --fail --location --silent --show-error \
              --retry 10 --retry-delay 3 --retry-all-errors \
              "https://raw.githubusercontent.com/thiepn/scan/visual-capture-phase21/visual-screenshots/${file}.png" \
              -o "play/store-assets/phone/${file}.png"
          done

      - name: Generate icon and feature graphic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          assets = Path('play/store-assets')
          assets.mkdir(parents=True, exist_ok=True)

          # Google Play preview PNGs must not carry an alpha channel.
          phone_dir = assets / 'phone'
          for screenshot_path in sorted(phone_dir.glob('*.png')):
              with Image.open(screenshot_path) as screenshot:
                  screenshot.convert('RGB').save(screenshot_path, 'PNG', optimize=True)

          PURPLE = '#5B5BD6'
          DARK = '#171A2C'
          MUTED = '#555C76'
          BG_A = (244, 245, 255)
          BG_B = (223, 235, 255)

          # 512x512 store icon: same purple document identity as the Android vector.
          icon = Image.new('RGB', (512, 512), PURPLE)
          draw = ImageDraw.Draw(icon)
          # Document body + folded corner.
          draw.polygon([(122, 72), (318, 72), (390, 144), (390, 440), (122, 440)], fill='white')
          draw.polygon([(318, 72), (318, 151), (390, 151)], fill='#D9DAFF')
          # Document lines.
          for y, x2 in [(228, 342), (294, 342), (360, 292)]:
              draw.rounded_rectangle((174, y, x2, y + 22), radius=11, fill=PURPLE)
          icon.save(assets / 'icon-512.png', 'PNG', optimize=True)

          # 1024x500 feature graphic (RGB / no alpha).
          feature = Image.new('RGB', (1024, 500), BG_A)
          px = feature.load()
          for x in range(feature.width):
              t = x / (feature.width - 1)
              for y in range(feature.height):
                  v = y / (feature.height - 1)
                  mix = min(1.0, 0.55 * t + 0.25 * v)
                  px[x, y] = tuple(round(BG_A[i] * (1 - mix) + BG_B[i] * mix) for i in range(3))

          fd = ImageDraw.Draw(feature)
          # Soft accent geometry.
          fd.ellipse((690, -180, 1110, 240), fill=(211, 217, 255))
          fd.ellipse((740, 270, 1120, 650), fill=(211, 241, 232))

          font_dir = '/usr/share/fonts/truetype/dejavu'
          title_font = ImageFont.truetype(f'{font_dir}/DejaVuSans-Bold.ttf', 78)
          sub_font = ImageFont.truetype(f'{font_dir}/DejaVuSans.ttf', 28)
          small_font = ImageFont.truetype(f'{font_dir}/DejaVuSans-Bold.ttf', 17)

          # Compact icon mark.
          fd.rounded_rectangle((64, 66, 124, 126), radius=14, fill=PURPLE)
          fd.polygon([(80, 78), (103, 78), (114, 89), (114, 114), (80, 114)], fill='white')
          fd.line((103, 78, 103, 91, 114, 91), fill='#D9DAFF', width=3)

          fd.text((64, 164), 'Scan', font=title_font, fill=DARK)
          fd.text((68, 272), 'Private document scanning', font=sub_font, fill=MUTED)
          fd.text((68, 320), 'OCR · searchable PDFs · local-first', font=small_font, fill=PURPLE)

          source = Image.open(assets / 'phone' / '01-library.png').convert('RGB')
          # Fit real screenshot into a phone-like frame without altering app UI.
          target_h = 430
          target_w = round(source.width * target_h / source.height)
          screenshot = source.resize((target_w, target_h), Image.Resampling.LANCZOS)
          frame_x, frame_y = 758, 34
          fd.rounded_rectangle(
              (frame_x - 8, frame_y - 8, frame_x + target_w + 8, frame_y + target_h + 8),
              radius=28,
              fill=(24, 27, 35),
          )
          mask = Image.new('L', screenshot.size, 0)
          ImageDraw.Draw(mask).rounded_rectangle((0, 0, screenshot.width, screenshot.height), radius=22, fill=255)
          feature.paste(screenshot, (frame_x, frame_y), mask)
          feature.save(assets / 'feature-graphic.png', 'PNG', optimize=True)

          print('Generated icon-512.png and feature-graphic.png')
          PY

      - name: Validate Play listing package
        run: python3 scripts/validate-play-listing.py

      - name: Commit generated store assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play/store-assets
          if git diff --cached --quiet; then
            echo "Play store assets are already current."
            exit 0
          fi
          git commit -m "S4: generate Google Play store assets"
          git pull --rebase origin s4-google-play-presence
          git push origin HEAD:s4-google-play-presence
