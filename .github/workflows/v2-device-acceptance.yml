name: Scan v2 Device Acceptance (Emulators)

on:
  workflow_dispatch:
  push:
    branches: [v2/development]
    paths:
      - '.github/workflows/v2-device-acceptance.yml'
      - 'docs/v2/P39_RELEASE_ENGINEERING.md'

permissions:
  contents: read

concurrency:
  group: scan-v2-device-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emulator:
    if: github.ref == 'refs/heads/v2/development'
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify v2 identity, compile emulator APKs
        run: |
          python3 scripts/check-v2-release-contract.py
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run P22/P24 regression and UI evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: bash ./scripts/run_v2_ui_qualification.sh
      - name: Record exact evidence SHA
        if: always()
        shell: bash
        run: |
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "api_level=${{ matrix.api-level }}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "emulator_only=true"
            echo "physical_device_certified=false"
          } > "v2-emulator-evidence-api-${{ matrix.api-level }}.txt"
      - name: Upload per-API emulator evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-v2-emulator-api-${{ matrix.api-level }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            v2-emulator-evidence-api-${{ matrix.api-level }}.txt
            v2-ui-evidence/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
