name: Publish v1 Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCAN_V1_MANUAL_ACCEPTANCE_SHA: ${{ vars.SCAN_V1_MANUAL_ACCEPTANCE_SHA }}
      SCAN_V1_ACCEPTANCE_RUN_ID: ${{ vars.SCAN_V1_ACCEPTANCE_RUN_ID }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require exact certified and accepted main commit
        shell: bash
        run: |
          set -euo pipefail

          test "${GITHUB_REF_NAME}" = "v1.0.0"
          git fetch origin main --no-tags

          RELEASE_SHA="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          MAIN_SHA="$(git rev-parse origin/main)"

          if [ "${RELEASE_SHA}" != "${MAIN_SHA}" ]; then
            echo "::error::v1.0.0 must point to the exact current main commit."
            echo "release=${RELEASE_SHA}"
            echo "main=${MAIN_SHA}"
            exit 1
          fi

          CERTIFIED_RUNS="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/certification.yml/runs?branch=main&head_sha=${RELEASE_SHA}&status=success&event=push" \
            --jq '.total_count')"

          if [ "${CERTIFIED_RUNS}" -lt 1 ]; then
            echo "::error::The release commit has no successful main-branch v1 Production Certification run."
            exit 1
          fi

          if [ -z "${SCAN_V1_MANUAL_ACCEPTANCE_SHA:-}" ]; then
            echo "::error::Repository variable SCAN_V1_MANUAL_ACCEPTANCE_SHA is not set."
            exit 1
          fi

          if [ "${SCAN_V1_MANUAL_ACCEPTANCE_SHA}" != "${RELEASE_SHA}" ]; then
            echo "::error::Manual acceptance attestation does not match the exact release SHA."
            echo "attested=${SCAN_V1_MANUAL_ACCEPTANCE_SHA}"
            echo "release=${RELEASE_SHA}"
            exit 1
          fi

          if [[ ! "${SCAN_V1_ACCEPTANCE_RUN_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Repository variable SCAN_V1_ACCEPTANCE_RUN_ID is missing or invalid."
            exit 1
          fi

          RUN_ENDPOINT="/repos/${GITHUB_REPOSITORY}/actions/runs/${SCAN_V1_ACCEPTANCE_RUN_ID}"
          RUN_HEAD="$(gh api -H "Accept: application/vnd.github+json" "${RUN_ENDPOINT}" --jq '.head_sha')"
          RUN_BRANCH="$(gh api -H "Accept: application/vnd.github+json" "${RUN_ENDPOINT}" --jq '.head_branch')"
          RUN_STATUS="$(gh api -H "Accept: application/vnd.github+json" "${RUN_ENDPOINT}" --jq '.status')"
          RUN_CONCLUSION="$(gh api -H "Accept: application/vnd.github+json" "${RUN_ENDPOINT}" --jq '.conclusion')"
          RUN_PATH="$(gh api -H "Accept: application/vnd.github+json" "${RUN_ENDPOINT}" --jq '.path')"
          RUN_EVENT="$(gh api -H "Accept: application/vnd.github+json" "${RUN_ENDPOINT}" --jq '.event')"

          if [ "${RUN_HEAD}" != "${RELEASE_SHA}" ]; then
            echo "::error::Evidence-bound acceptance run targets a different SHA."
            exit 1
          fi
          if [ "${RUN_BRANCH}" != "main" ]; then
            echo "::error::Evidence-bound acceptance run did not target main."
            exit 1
          fi
          if [ "${RUN_STATUS}" != "completed" ] || [ "${RUN_CONCLUSION}" != "success" ]; then
            echo "::error::Evidence-bound acceptance run is not a successful completed run."
            exit 1
          fi
          if [ "${RUN_PATH}" != ".github/workflows/production-acceptance.yml" ]; then
            echo "::error::Evidence-bound run came from an unexpected workflow: ${RUN_PATH}"
            exit 1
          fi
          if [ "${RUN_EVENT}" != "push" ] && [ "${RUN_EVENT}" != "workflow_dispatch" ]; then
            echo "::error::Evidence-bound acceptance run has unexpected event: ${RUN_EVENT}"
            exit 1
          fi

          ARTIFACT_NAME="scan-v1-production-acceptance-${RELEASE_SHA}"
          ARTIFACT_COUNT="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${SCAN_V1_ACCEPTANCE_RUN_ID}/artifacts" \
            --jq "[.artifacts[] | select(.name == \"${ARTIFACT_NAME}\" and .expired == false)] | length")"

          if [ "${ARTIFACT_COUNT}" -ne 1 ]; then
            echo "::error::Expected exactly one non-expired acceptance artifact named ${ARTIFACT_NAME}; found ${ARTIFACT_COUNT}."
            exit 1
          fi

          echo "release_sha=${RELEASE_SHA}"
          echo "acceptance_run_id=${SCAN_V1_ACCEPTANCE_RUN_ID}"
          echo "acceptance_artifact=${ARTIFACT_NAME}"

      - name: Download exact evidence-bound acceptance artifact
        shell: bash
        run: |
          set -euo pipefail
          ACCEPTANCE_DIR="${RUNNER_TEMP}/accepted-release"
          mkdir -p "${ACCEPTANCE_DIR}"

          gh run download "${SCAN_V1_ACCEPTANCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "scan-v1-production-acceptance-${GITHUB_SHA}" \
            --dir "${ACCEPTANCE_DIR}"

      - name: Promote exact accepted APK and AAB bytes
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_PAYLOAD="${RUNNER_TEMP}/release-payload"
          rm -rf "${RELEASE_PAYLOAD}"
          mkdir -p "${RELEASE_PAYLOAD}"

          bash scripts/promote-v1-accepted-artifact.sh \
            "${RUNNER_TEMP}/accepted-release" \
            "${GITHUB_SHA}" \
            "${SCAN_V1_ACCEPTANCE_RUN_ID}" \
            "${RELEASE_PAYLOAD}"

          (
            cd "${RELEASE_PAYLOAD}"
            sha256sum -c release-checksums.sha256
          )
          cat "${RELEASE_PAYLOAD}/release-provenance.txt"

      - name: Create draft GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_PAYLOAD="${RUNNER_TEMP}/release-payload"

          if EXISTING_DRAFT="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "${EXISTING_DRAFT}" = "true" ]; then
              echo "Removing stale draft release from an earlier failed attempt."
              gh release delete "${GITHUB_REF_NAME}" --yes
            else
              echo "::error::A non-draft release already exists for ${GITHUB_REF_NAME}; refusing to overwrite it."
              exit 1
            fi
          fi

          gh release create "${GITHUB_REF_NAME}" \
            "${RELEASE_PAYLOAD}/Scan-v1.0.0.apk" \
            "${RELEASE_PAYLOAD}/Scan-v1.0.0.aab" \
            "${RELEASE_PAYLOAD}/release-checksums.sha256" \
            "${RELEASE_PAYLOAD}/release-provenance.txt" \
            --draft \
            --verify-tag \
            --title "Scan v1.0.0" \
            --notes-file docs/RELEASE_NOTES_V1.0.0.md

      - name: Verify GitHub-stored draft release assets
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_PAYLOAD="${RUNNER_TEMP}/release-payload"
          DOWNLOADED_RELEASE="${RUNNER_TEMP}/downloaded-draft-release"

          DRAFT_STATE="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')"
          if [ "${DRAFT_STATE}" != "true" ]; then
            echo "::error::Release must remain a draft until remote asset verification passes."
            exit 1
          fi

          mapfile -t REMOTE_ASSETS < <(
            gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | LC_ALL=C sort
          )
          EXPECTED_ASSETS=(
            "Scan-v1.0.0.aab"
            "Scan-v1.0.0.apk"
            "release-checksums.sha256"
            "release-provenance.txt"
          )
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED_ASSETS[@]}" | LC_ALL=C sort)

          if [ "${#REMOTE_ASSETS[@]}" -ne "${#EXPECTED_SORTED[@]}" ] || \
             [ "$(printf '%s\n' "${REMOTE_ASSETS[@]}")" != "$(printf '%s\n' "${EXPECTED_SORTED[@]}")" ]; then
            echo "::error::Draft release asset set is not exact."
            printf 'remote: %s\n' "${REMOTE_ASSETS[@]}"
            exit 1
          fi

          rm -rf "${DOWNLOADED_RELEASE}"
          mkdir -p "${DOWNLOADED_RELEASE}"
          gh release download "${GITHUB_REF_NAME}" --dir "${DOWNLOADED_RELEASE}"

          bash scripts/verify-release-publication.sh \
            "${RELEASE_PAYLOAD}" \
            "${DOWNLOADED_RELEASE}" \
            "${GITHUB_SHA}" \
            "${SCAN_V1_ACCEPTANCE_RUN_ID}"

      - name: Publish verified GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --draft=false

          DRAFT_STATE="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')"
          if [ "${DRAFT_STATE}" != "false" ]; then
            echo "::error::Verified release did not transition to public state."
            exit 1
          fi

          echo "Published ${GITHUB_REF_NAME} only after GitHub-stored asset verification passed."

      - name: Verify published immutable release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ENDPOINT="/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          IMMUTABLE="$(gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             "${RELEASE_ENDPOINT}"             --jq '.immutable')"

          if [ "${IMMUTABLE}" != "true" ]; then
            echo "::error::Published release is not immutable. Removing the mutable release and refusing v1.0.0 publication."
            gh release delete "${GITHUB_REF_NAME}" --yes || true
            exit 1
          fi

          echo "GitHub reports ${GITHUB_REF_NAME} as immutable."

          VERIFIED_RELEASE=false
          for attempt in $(seq 1 12); do
            if gh release verify "${GITHUB_REF_NAME}"; then
              VERIFIED_RELEASE=true
              break
            fi
            echo "Release attestation not ready yet (attempt ${attempt}/12); retrying..."
            sleep 5
          done

          if [ "${VERIFIED_RELEASE}" != "true" ]; then
            echo "::error::GitHub immutable-release attestation could not be verified."
            exit 1
          fi

          RELEASE_PAYLOAD="${RUNNER_TEMP}/release-payload"
          PUBLIC_RELEASE="${RUNNER_TEMP}/downloaded-public-release"
          rm -rf "${PUBLIC_RELEASE}"
          mkdir -p "${PUBLIC_RELEASE}"

          gh release download "${GITHUB_REF_NAME}" --dir "${PUBLIC_RELEASE}"

          bash scripts/verify-release-publication.sh             "${RELEASE_PAYLOAD}"             "${PUBLIC_RELEASE}"             "${GITHUB_SHA}"             "${SCAN_V1_ACCEPTANCE_RUN_ID}"

          for asset in             Scan-v1.0.0.apk             Scan-v1.0.0.aab             release-checksums.sha256             release-provenance.txt
          do
            gh release verify-asset "${GITHUB_REF_NAME}" "${RELEASE_PAYLOAD}/${asset}"
          done

          echo "Verified immutable public release, release attestation, and all public v1.0.0 assets."
